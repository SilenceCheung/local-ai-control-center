name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: >-
          python -m pip install
          fastapi httpx pyyaml psutil pytest pytest-asyncio
          huggingface_hub tqdm

      - name: Python tests
        run: python -m pytest -q backend/tests

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec vitest run

      - name: Frontend production build
        working-directory: frontend
        run: pnpm build

      - name: Native macOS build
        run: >-
          swift build
          --package-path apps/LocalAIApp
          --scratch-path apps/LocalAIApp/.build

      - name: Patch hygiene
        run: git diff --check
